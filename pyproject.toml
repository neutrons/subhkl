[project]
name = "subhkl"
description = "Solving crystal orientation from Laue images"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11.0",
    "matplotlib>=3.8.4",
    "scikit-image>=0.23.2",
    "evosax>=0.2.0",
    "jax[cpu]>=0.9.1",
    "typer>=0.12.3",
    "opencv-python>=4.11.0",
    "gemmi>=0.7.3",
    "tdqm>=0.0.1",
    "scipy>=1.17.1",
]

license = { text = "GPL3.0" }

# Register the image-container reader with dxtbx's format registry so a DIALS
# environment (where subhkl is installed) can open the ImageSets written by the
# --dials export (e.g. in dials.image_viewer).
# The entry-point *name* encodes the format's base class(es) after a colon, as
# dxtbx's registry expects (e.g. "FormatHDF5:FormatMultiImage,Format"). Without
# the ":FormatHDF5" suffix the class is an orphan in dxtbx's format DAG and
# file-based detection never descends into it.
[project.entry-points."dxtbx.format"]
"FormatSubhkl:FormatHDF5" = "subhkl.io.dxtbx_format:FormatSubhkl"

[build-system]
requires = [
  "setuptools",
   "wheel",
   "toml",
   "versioningit"
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# JAX with CUDA 12 support (NVIDIA GPUs)
cuda12 = [
  "jax[cuda12]",
]

# JAX with ROCm support (AMD GPUs)
rocm = [
  "jax[rocm]",
]

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}"
dirty = "{next_version}"
distance-dirty = "{next_version}"

[tool.versioningit.write]
file = "src/subhkl/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yml","*.yaml","*.ini","*.json"]

[tool.pylint]
max-line-length = 80
disable = ["too-many-locals",
           "too-many-statements",
           "too-many-instance-attributes",
           "too-many-arguments",
           "duplicate-code"
]
extension-pkg-whitelist = ["PyQt5"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "mesolite: needs the mesolite dataset, downloaded from Zenodo on first use (select with '-m mesolite')",
]
# Downloading the mesolite dataset takes hours, so the tests that need it are
# left out of a plain `pytest` run. Select them explicitly with `-m mesolite`.
addopts = "-m 'not mesolite'"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E741"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.2",
    "pytest-cov>=4.1.0",
    "pytest-dependency>=0.6.1",
    "ruff>=0.2.0",
]

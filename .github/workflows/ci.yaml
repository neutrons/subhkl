name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Linting + formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run linting
        run: |
          uv run ruff format --diff
          uv run ruff check

  test-unit:
    name: Unit tests
    strategy:
      matrix:
        python-version: ["3.12"]
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Two heavyweights share this job.  test_1_to_n_goniometer_mapping runs
    # the indexer with refine_goniometer=True (a global search): 28.6 min on
    # main, 46.1 min here.  The sparse-rbf finder tests run the global solver
    # to its convergence certificate (the relative KKT stopping test) instead
    # of exiting early at an uncertified point, which is 2-3x more solver
    # iterations per test: ~40 min locally, ~100 min on a hosted runner.  The
    # previous 120-minute budget was measured-cancelled at exactly 2h; 240
    # leaves room for runner variance.  If this becomes painful, shard the
    # job (sparse-rbf suite vs the rest) rather than weakening the stop test.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -v -m "not slow and not integration and not mesolite"

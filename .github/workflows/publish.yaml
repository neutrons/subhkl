name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' #  Matches v1.2.3
      - '[0-9]+.[0-9]+.[0-9]+'  # Matches 1.2.3
  workflow_dispatch:

env:
  IMAGE_NAME: neutrons/subhkl

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/subhkl
    permissions:
      id-token: write # Required for PyPI Trusted Publishing
      contents: read  # Required to check out code
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write # Required to push to GHCR
      contents: read  # Required to check out code
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        # Safely handles if GITHUB_REF points to a branch instead of a tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Strip the refs/tags/ prefix first
            RAW_VERSION="${GITHUB_REF#refs/tags/}"

            # Strip a leading 'v' if it exists
            CLEAN_VERSION="${RAW_VERSION#v}"
          else
            CLEAN_VERSION="latest-manual"
          fi
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
